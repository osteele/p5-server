name: Test Cross-Platform

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
        matrix:
          os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check workspaces
        run: bun run check
